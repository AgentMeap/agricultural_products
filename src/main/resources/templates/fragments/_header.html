<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
        <a class="navbar-brand d-flex align-items-center" href="/index">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px; margin-right: 10px;"/>
            <strong>Nông Sản Sạch</strong>
        </a>

        <form class="d-flex ms-auto me-3 w-50">
            <input class="form-control me-2" type="search" placeholder="Tìm kiếm sản phẩm..." aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </form>

        <ul class="navbar-nav">
            <li class="nav-item" th:if="${account == null}">
                <a class="nav-link login-link" href="/login">
                    <i class="bi bi-person-circle"></i> Đăng nhập
                </a>
            </li>
            <li class="nav-item dropdown" th:if="${account != null}">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${account.userName}">Tài khoản</span>
                </a>
                <ul class="dropdown-menu text-center menu-profile" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" href="/profile">Hồ sơ</a></li>
                    <li><a class="dropdown-item" href="#">Đơn hàng</a></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button class="btn-logout" type="submit">Đăng xuất</button>
                        </form>
                    </li>
                </ul>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="bi bi-cart3"></i> Giỏ hàng</a>
            </li>
        </ul>
    </nav>


    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container d-flex justify-content-between">
            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white" th:href="@{/index}"><i class="bi bi-house-door-fill"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white" href="#"><i class="bi bi-shop"></i> Sản phẩm</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white" th:href="@{/about-us}"><i class="bi bi-people-fill"></i> Về chúng tôi</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white" href="#"><i class="bi bi-telephone-fill"></i> Liên hệ</a>
                    </li>
                </ul>
            </div>
            <div class="text-white d-none d-lg-block">
                <i class="bi bi-telephone-fill"></i> Hotline: 1900-1234
            </div>
        </div>
    </nav>
</header>

</body>
</html>
