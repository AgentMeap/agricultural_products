<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.productName} + ' - Nông Sản Sạch'">Chi tiết sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link th:href="@{/css/index.css}" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script th:src="@{/js/index.js}" defer></script>

    <style>
        .product-detail {
            max-width: 900px;
            margin: 50px auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Overrides the product-img rule in index.css for this specific page */
        .product-img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/_header :: header}"></div>

<div class="container product-detail bg-white p-4 my-5">
    <div class="row">
        <div class="col-md-6">
            <img class="product-img"
                 th:src="@{${product.productImage}}"
                 th:alt="${product.productName}">
        </div>
        <div class="col-md-6">
            <h2 th:text="${product.productName}">Tên Sản Phẩm</h2>
            <p><strong>Giá:</strong>
                <span th:text="${#numbers.formatDecimal(product.productPrice, 0, 'COMMA', 0, 'POINT')} + 'đ / 1kg'">0đ / 1kg</span>
            </p>
            <p><strong>Mô tả:</strong></p>
            <p th:text="${product.productDescription}">Mô tả sản phẩm.</p>

            <button class="btn btn-success mt-3">
                <i class="bi bi-cart-plus"></i> Thêm vào giỏ hàng
            </button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/_footer :: footer}"></div>

</body>
</html>
